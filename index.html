<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#eee8dd" />
    <meta name="description" content="لوحة المقدم لإدارة لعبة تحدي الكنبة بين فريقين" />
    <title>تحدّي الكنبة — لوحة المقدم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script>
      (function(){
        const firebaseConfig={
          apiKey:"AIzaSyCV21gdTOjogRCYyEJRqY777XsdJK_3K3g",
          authDomain:"sofa-challenge.firebaseapp.com",
          databaseURL:"https://sofa-challenge-default-rtdb.firebaseio.com",
          projectId:"sofa-challenge",
          storageBucket:"sofa-challenge.firebasestorage.app",
          messagingSenderId:"277640183380",
          appId:"1:277640183380:web:64c8da93269a49f7a2f7c1",
          measurementId:"G-R4MRDLTVHE"
        };
        try{
          firebase.initializeApp(firebaseConfig);
          const db=firebase.database();
          const hash=()=>location.hash.replace(/^#\/?/,"/");
          const role=()=>{const h=hash();return h==="/join"?"join":h==="/screen"?"screen":h==="/leader"||h==="/"?"leader":"other"};
          window.__sofaFirebase={db,role};
          window.__firebaseApplying=false;
          window.__firebaseWaiting={};

          const originalSet=Storage.prototype.setItem;
          Storage.prototype.setItem=function(key,value){
            originalSet.call(this,key,value);
            if(key!=="sofa-challenge-state"||window.__firebaseApplying||role()!=="leader")return;
            try{
              const state=JSON.parse(value);
              const waiting=window.__firebaseWaiting||{};
              const existing=Array.isArray(state.participants)?state.participants:[];
              const ids=new Set(existing.map(p=>p.id));
              const pending=Object.values(waiting).filter(p=>!ids.has(p.id));
              if(pending.length){
                state.participants=existing.concat(pending);
                originalSet.call(this,key,JSON.stringify(state));
              }
              db.ref("gameState").set(state).catch(()=>{});
            }catch(e){}
          };

          db.ref("waitingPlayers").on("value",snap=>{
            window.__firebaseWaiting=snap.val()||{};
            if(role()!=="leader")return;
            try{
              const raw=localStorage.getItem("sofa-challenge-state");
              if(!raw)return;
              const state=JSON.parse(raw);
              const existing=Array.isArray(state.participants)?state.participants:[];
              const ids=new Set(existing.map(p=>p.id));
              const pending=Object.values(window.__firebaseWaiting).filter(p=>!ids.has(p.id));
              if(pending.length){
                window.__firebaseApplying=true;
                state.participants=existing.concat(pending);
                localStorage.setItem("sofa-challenge-state",JSON.stringify(state));
                window.__firebaseApplying=false;
                db.ref("gameState").set(state).catch(()=>{});
              }
            }catch(e){window.__firebaseApplying=false}
          });

          db.ref("gameState").on("value",snap=>{
            const state=snap.val();
            if(!state||role()==="leader")return;
            try{
              window.__firebaseApplying=true;
              localStorage.setItem("sofa-challenge-state",JSON.stringify(state));
              window.__firebaseApplying=false;
            }catch(e){window.__firebaseApplying=false}
          });

          document.addEventListener("click",function(e){
            if(role()!=="join")return;
            const btn=e.target.closest("button");
            if(!btn||btn.textContent.trim()!=="دخول اللعبة")return;
            const input=document.querySelector('input[aria-label="اسم اللاعب"]');
            const name=(input&&input.value||"").trim();
            if(!name)return;
            const id="p-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);
            const player={id,name,team:"sun",avatar:name.charAt(0)};
            db.ref("waitingPlayers/"+id).set(player).catch(()=>{});
            localStorage.setItem("sofa-player-id",id);
          },true);

          const cleanJoin=()=>{
            if(role()!=="join")return;
            const id=localStorage.getItem("sofa-player-id");
            if(!id)return;
            window.addEventListener("beforeunload",()=>db.ref("waitingPlayers/"+id).remove().catch(()=>{}));
          };
          setTimeout(cleanJoin,500);
          window.addEventListener("hashchange",cleanJoin);

          setTimeout(()=>{
            if(role()!=="leader")return;
            try{
              const raw=localStorage.getItem("sofa-challenge-state");
              if(raw)db.ref("gameState").once("value").then(s=>{if(!s.exists())db.ref("gameState").set(JSON.parse(raw)).catch(()=>{})});
            }catch(e){}
          },1500);
        }catch(e){console.warn("Firebase init failed",e)}
      })();
    </script>
